<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Three Tier Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Three Tier Docker Application</h1>

    <p>Frontend → Backend → MongoDB</p>

    <button onclick="getUsers()">
        Get Users
    </button>

    <div id="result"></div>

    <script>

        async function getUsers() {

            try {

                const response = await fetch("/api/users");

                const data = await response.json();

                document.getElementById("result").innerText =
                    JSON.stringify(data);

            } catch (error) {

                document.getElementById("result").innerText =
                    "Error connecting to backend";

            }
        }

    </script>

</body>

</html>
